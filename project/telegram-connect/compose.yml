services:
  proxy:
    image: ubuntu/squid@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    container_name: hexenvpn-telegram-connect
    user: "13:13"
    entrypoint: ["/usr/sbin/squid"]
    command: ["-N", "-d", "1", "-f", "/etc/squid/squid.conf"]
    restart: unless-stopped
    ports:
      - "0.0.0.0:3128:3128/tcp"
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /run:size=1m,uid=13,gid=13
      - /var/log/squid:size=8m,uid=13,gid=13
      - /var/spool/squid:size=8m,uid=13,gid=13
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 64
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
